<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aux Grognards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    
    <style>
        /* Conteneur principal en Flexbox */
        .contact-container {
            display: flex;
            flex-direction: column; /* Mobile : tout s'empile verticalement */
            gap: 30px;
        }

        /* PC : On repasse en côte à côte */
        @media (min-width: 1024px) {
            .contact-container {
                flex-direction: row;
                align-items: flex-start;
            }
            .contact-left, .contact-right {
                flex: 1;
            }
        }

        /* Style des cartes */
        .info-card {
            border-left: 3px solid var(--gold) !important;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            margin-bottom: 20px;
        }

        .map-container iframe {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            filter: grayscale(1) invert(0.9); /* Style sombre pour la carte */
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .info-item { margin-bottom: 15px; }
        .info-item strong { color: var(--gold); display: block; margin-bottom: 5px; }
        
        input, textarea { margin-bottom: 15px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AUX GROGNARDS</div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="carte.html">La Carte</a></li>
            <li><a href="galerie.html">Galerie</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <section>
            <h2 class="section-title" data-aos="fade-down">Contact</h2>
            <p class="section-subtitle" data-aos="fade-up">Nous trouver & Nous écrire</p>

            <div class="contact-container">
                
                <div class="contact-left" data-aos="fade-right">
                    <div class="info-card">
                        <div class="info-item">
                            <strong>Adresse</strong>
                            <p>Rue Dénecourt, 77300 Fontainebleau</p>
                        </div>
                        <div class="info-item">
                            <strong>Téléphone</strong>
                            <p><a href="tel:+33164222300" style="color:white; text-decoration:none;">01 64 22 23 00</a></p>
                        </div>
                        <div class="info-item">
                            <strong>Horaires</strong>
                            <p>Tous les jours : 08h00 – 02h00</p>
                        </div>
                    </div>

                    <div class="map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2645.6!2d2.7!3d48.4!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDjCsDI0JzAwLjAiTiAywrA0MicwMC4wIkU!5e0!3m2!1sfr!2sfr!4v123456789" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="contact-right" data-aos="fade-left">
                    <div class="info-card" style="border-left: none; border-right: 3px solid var(--gold);">
                        <form id="contact-form">
                            <input type="text" placeholder="Votre Nom" required>
                            <input type="email" placeholder="Votre Email" required>
                            <textarea rows="5" placeholder="Votre Message" required></textarea>
                            <button type="submit" class="btn-gold" style="width:100%; border:none; padding: 15px; cursor:pointer;">
                                Envoyer le message
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <footer style="padding: 40px 8%; text-align: center; border-top: 1px solid var(--border); color: var(--grey); font-size: 0.8rem;">
        <p>© 2026 Aux Grognards Fontainebleau - Tous droits réservés.</p>
    </footer>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Menu Mobile
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        menuToggle.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>
