<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aux Grognards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    
    <style>
        /* Optimisation de la structure pour mobile */
        .contact-container {
            display: flex;
            flex-direction: column; /* Empile tout verticalement par défaut */
            gap: 40px;
        }

        /* Sur PC, on remet côte à côte */
        @media (min-width: 1024px) {
            .contact-container {
                flex-direction: row;
                align-items: flex-start;
            }
            .contact-info, .contact-form-section {
                flex: 1;
            }
        }

        /* Ordre spécifique sur mobile */
        .info-card { order: 1; }  /* Infos en premier */
        .map-container { order: 2; margin: 20px 0; } /* Map en deuxième */
        .contact-form-section { order: 3; } /* Formulaire en dernier */

        .info-card {
            border-left: 3px solid var(--gold) !important;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)) !important;
            padding: 30px !important;
        }

        .map-container iframe {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            filter: grayscale(1) invert(0.9);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AUX GROGNARDS</div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="carte.html">La Carte</a></li>
            <li><a href="galerie.html">Galerie</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <section>
            <h2 class="section-title" data-aos="fade-down">Contact</h2>
            <p class="section-subtitle" data-aos="fade-up">Nous trouver & Nous écrire</p>

            <div class="contact-container">
                
                <div class="info-card" data-aos="fade-right">
                    <h3 class="info-title">Informations</h3>
                    <div class="info-item">
                        <p><strong>Adresse :</strong><br>Rue Dénecourt, 77300 Fontainebleau</p>
                    </div>
                    <div class="info-item">
                        <p><strong>Téléphone :</strong><br><a href="tel:+33164222300" style="color:var(--gold); text-decoration:none;">01 64 22 23 00</a></p>
                    </div>
                    <div class="info-item">
                        <p><strong>Horaires :</strong><br>Ouvert tous les jours de 08h00 à 02h00</p>
                    </div>
                    
                    <div class="map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2642.7845665352697!2d2.7001438!3d48.4050268!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e5f483329f6365%3A0x6b772097e161040a!2sAux%20Grognards!5e0!3m2!1sfr!2sfr!4v1715000000000" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>

                <div class="contact-form-section" data-aos="fade-left">
                    <form id="contact-form">
                        <div class="input-group">
                            <input type="text" name="name" placeholder="Votre Nom" required>
                        </div>
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Votre Email" required>
                        </div>
                        <div class="input-group">
                            <textarea name="message" rows="5" placeholder="Votre Message" required></textarea>
                        </div>
                        <button type="submit" class="btn-gold" style="width:100%; cursor:pointer;">Envoyer le message</button>
                    </form>
                </div>

            </div>
        </section>
    </div>

    <footer style="padding: 40px 8%; text-align: center; border-top: 1px solid var(--border); color: var(--grey); font-size: 0.8rem;">
        <p>&copy; 2026 Aux Grognards Fontainebleau - Tous droits réservés.</p>
    </footer>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Menu Mobile
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        menuToggle.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>
