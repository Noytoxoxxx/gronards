<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact - Aux Grognards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    
    <style>
        /* Conteneur principal */
        .contact-container {
            display: flex;
            flex-direction: column; /* Mobile : tout s'empile */
            width: 100%;
            gap: 20px;
        }

        /* PC : Côte à côte */
        @media (min-width: 1024px) {
            .contact-container {
                flex-direction: row;
                gap: 50px;
            }
            .contact-left, .contact-right { flex: 1; }
        }

        /* Cartes d'info */
        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-left: 3px solid var(--gold);
            padding: 20px;
            width: 100%;
            box-sizing: border-box; /* Empêche de sortir de l'écran */
        }

        .info-item { margin-bottom: 15px; }
        .info-item strong { color: var(--gold); display: block; font-size: 0.9rem; text-transform: uppercase; }

        /* Carte Google Maps */
        .map-container {
            width: 100%;
            margin-top: 10px;
        }
        .map-container iframe {
            width: 100%;
            height: 250px;
            border-radius: 4px;
            border: 1px solid var(--border);
            filter: grayscale(1) invert(0.9);
        }

        /* Formulaire */
        .contact-right {
            width: 100%;
            box-sizing: border-box;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box; /* Crucial pour ne pas dépasser */
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: white;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AUX GROGNARDS</div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="carte.html">La Carte</a></li>
            <li><a href="galerie.html">Galerie</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <section>
            <h2 class="section-title" data-aos="fade-down">Contact</h2>
            
            <div class="contact-container">
                
                <div class="contact-left">
                    <div class="info-card">
                        <div class="info-item">
                            <strong>Adresse</strong>
                            <p>Rue Dénecourt, 77300 Fontainebleau</p>
                        </div>
                        <div class="info-item">
                            <strong>Téléphone</strong>
                            <p><a href="tel:+33164222300" style="color:white; text-decoration:none;">01 64 22 23 00</a></p>
                        </div>
                        <div class="map-container">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2643.5!2d2.7000!3d48.4060!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e5f3f000000000%3A0x0!2sAux%20Grognards!5e0!3m2!1sfr!2sfr!4v123456789" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    </div>
                </div>

                <div class="contact-right">
                    <div class="info-card" style="border-left:none; border-top:3px solid var(--gold);">
                        <p style="margin-bottom:20px; color:var(--gold);">Envoyez-nous un message</p>
                        <form id="contact-form">
                            <input type="text" placeholder="Votre Nom" required>
                            <input type="email" placeholder="Votre Email" required>
                            <textarea rows="4" placeholder="Votre Message" required></textarea>
                            <button type="submit" class="btn-gold" style="width:100%; padding: 15px; border:none; cursor:pointer;">
                                Envoyer
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <footer style="padding: 40px 8%; text-align: center; border-top: 1px solid var(--border); color: var(--grey); font-size: 0.8rem;">
        <p>© 2026 Aux Grognards Fontainebleau</p>
    </footer>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        menuToggle.addEventListener('click', () => { navList.classList.toggle('active'); });
    </script>
</body>
</html>
