<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact - Aux Grognards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    
    <style>
        /* --- TA STRUCTURE --- */
        .info-card {
            border-left: 3px solid var(--gold) !important;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)) !important;
            padding: 30px !important;
            box-sizing: border-box; /* EMPECHE DE DEBORDER */
        }

        .info-title {
            color: var(--gold);
            font-size: 1.4rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-family: 'Playfair Display', serif;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .info-icon {
            font-size: 1.1rem;
            margin-right: 15px;
            background: rgba(197, 160, 89, 0.1);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .info-text { flex-grow: 1; }

        .info-text span {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--gold);
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .info-text p {
            color: var(--white);
            font-size: 0.95rem;
            font-weight: 300;
            margin: 0;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.3s;
            margin-left: 10px;
            white-space: nowrap;
        }

        .map-container {
            margin-top: 20px;
            height: 230px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- LE FIX POUR MOBILE --- */
        @media (max-width: 768px) {
            .contact-container {
                display: flex;
                flex-direction: column; /* Empile les blocs */
                width: 100%;
                gap: 20px;
            }
            .contact-info, .contact-form {
                width: 100% !important;
                box-sizing: border-box;
            }
            input, textarea {
                width: 100% !important;
                box-sizing: border-box !important; /* Force le respect des bords */
            }
            .main-wrapper {
                padding: 10px; /* Evite que le texte colle aux bords du tel */
            }
        }

        /* --- POP-UP --- */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(10px);
        }

        .popup-content {
            max-width: 400px; width: 85%; text-align: center;
            border: 1px solid var(--gold); background: var(--dark-bg);
            padding: 50px 30px; border-radius: 12px; position: relative;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AUX GROGNARDS</div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-list">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="carte.html">La Carte</a></li>
            <li><a href="galerie.html">Galerie</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <section>
            <h2 class="section-title" data-aos="fade-down">Nous Contacter</h2>
            <div class="contact-container">
                
                <div class="contact-info" data-aos="fade-right">
                    <div class="card info-card">
                        <h3 class="info-title">Informations</h3>
                        <div class="info-item">
                            <div class="info-icon">📍</div>
                            <div class="info-text">
                                <span>Adresse</span>
                                <p>15 Rue Dénecourt, Fontainebleau</p>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">📞</div>
                            <div class="info-text">
                                <span>Téléphone</span>
                                <p>01 60 39 16 17</p>
                            </div>
                        </div>
                        <div class="map-container">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2643.54145718717!2d2.7001479!3d48.4042894!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e5f5a39ab3b5c5%3A0x49625f778f24cc4d!2sAux%20Grognards!5e0!3m2!1sfr!2sfr!4v17000000000005" width="100%" height="100%" style="border:0; filter: grayscale(1) invert(90%);" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    </div>
                </div>

                <div class="contact-form" data-aos="fade-left">
                    <form id="contact-form">
                        <div class="input-group"><input type="text" name="nom" placeholder="Votre Nom" required></div>
                        <div class="input-group"><input type="email" name="email" placeholder="Votre Email" required></div>
                        <div class="input-group"><textarea name="message" rows="6" placeholder="Message" required></textarea></div>
                        <button type="submit" id="submit-btn" class="btn-gold">Envoyer le message</button>
                    </form>
                </div>

            </div>
        </section>
    </div>

    <div id="popup-success" class="popup-overlay">
        <div class="popup-content">
            <span class="close-popup" onclick="closePopup()">×</span>
            <h3 style="color:var(--gold); font-size: 2rem;">Envoyé !</h3>
            <button class="btn-gold" style="margin-top:25px;" onclick="closePopup()">Continuer</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        menuToggle.addEventListener('click', () => { navList.classList.toggle('active'); });

        const form = document.getElementById("contact-form");
        const popup = document.getElementById("popup-success");
        const btn = document.getElementById("submit-btn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            btn.innerHTML = "Envoi...";
            btn.disabled = true;
            const data = new FormData(event.target);
            try {
                const response = await fetch("https://formspree.io/f/mnjwlvon", {
                    method: 'POST', body: data, headers: { 'Accept': 'application/json' }
                });
                if (response.ok) { popup.style.display = "flex"; form.reset(); }
            } catch (error) { alert("Erreur"); }
            btn.innerHTML = "Envoyer"; btn.disabled = false;
        });

        function closePopup() { popup.style.display = "none"; }
    </script>
</body>
</html>
